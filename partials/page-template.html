<!doctype html>
<html lang="he" dir="rtl">
<!--
  PAGE TEMPLATE (copy to B/<name>.html, then run: node tools/stamp.mjs)
  - Fill TITLE (unique, built on the page's search phrase), DESCRIPTION, H1. No canonical (demo).
  - Header/footer: keep the empty marker pairs; stamp.mjs fills them from partials/.
  - Sections: <section class="ch bone|navy pg-sec" data-sc-act="flow">, alternate bone / navy.
    Hero: add class pg-hero (label + h1 + .lede). Chapter rule:.
    Text: .prose (max 38em). Two columns: .two (first child 6/12, last 5/12; stacks < 860px).
    Numbered list: <ol class="rows"><li><h3>..</h3><p>..</p></li></ol> (Hebrew counters).
    Source note under a fact: <small class="src">מקור: ...</small>.
    FAQ: <div class="faq"><details><summary>Q</summary><p>A</p></details>...</div>.
    CTA: <section class="ch navy pg-sec cta"> with <p class="run"> + <div class="acts"><a class="btn-p">..</a><a class="btn-s">..</a></div>.
  - Reveal: only on blocks (and data-sc-stagger WITH). Check: node lab/reveal-check.mjs <url>.
  - Images: assets/*.webp only, width/height set, loading="lazy", Hebrew alt. No forms that submit.
  - Facts only from SOURCES.md / crawl2/FACTS-R2.md; append new ones to SOURCES.md.
-->
